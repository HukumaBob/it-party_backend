volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    env_file:
        - ../.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
  backend:
    build:
      context: ../backend/
      dockerfile: Dockerfile
    env_file:
        - ../.env
    depends_on:
      - db
      - redis
    volumes:
      - static:/app/static/
      - media:/app/media/
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - static:/app/result_build/
  nginx:
    env_file:
        - ../.env  
    build: .
    ports:
      - 8000:80
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/var/html/static/
      - media:/var/html/media/       
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
