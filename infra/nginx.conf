server {

  listen 80;
  server_tokens off;
  client_max_body_size 20M;

  location /api/v1/ {
    proxy_pass http://backend:8000/api/v1/;
    add_header 'Access-Control-Allow-Origin' '*'; # Разрешить запросы со всех доменов
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS'; # Разрешенные методы
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range'; # Разрешенные заголовки
  }

    location /auth/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/auth/;
  }

  location /django_admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

    location /mvt_admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/mvt_admin/;
  }

  location /static/admin {
    root /var/html/;
  }

  location /static/rest_framework/ {
    root /var/html/;
  }

  location /static/drf-yasg/ {
    root /var/html/;
  }

  location /media/ {
    autoindex on;
    root /var/html/;
  }

  location / {
    proxy_set_header Host $http_host;    
    alias /staticfiles/;
    try_files $uri $uri/ /index.html =404;
    }

}